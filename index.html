  <script>
    // Handle script/asset loading errors (e.g. from new deployments with new hashed filenames)
    (function() {
      function reloadPage(key) {
        var lastReload = localStorage.getItem(key);
        var now = Date.now();
        if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
          localStorage.setItem(key, String(now));
          window.location.reload();
        }
      }

      // Catch dynamic import preload failures (Vite-specific event)
      window.addEventListener('vite:preloadError', function() {
        reloadPage('last-preload-reload');
      });

      // Catch general resource loading errors (like main script file 404/MIME type errors)
      window.addEventListener('error', function(event) {
        var target = event.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var url = target.src || target.href;
          if (url && (url.indexOf('/assets/') !== -1 || url.indexOf('/src/') !== -1)) {
            reloadPage('last-resource-reload');
          }
        }
      }, true); // Use capture phase because resource errors do not bubble
    })();

    // Watchdog: cuando el usuario toca "Actualizar" (useUpdater.tsx), se marca
    // sessionStorage['pwa-update-pending'] justo antes de recargar. Si tras esa
    // recarga la app nunca termina de arrancar (evento 'app-booted', disparado
    // por DatabaseWrapper una vez la base de datos local está lista) — por un
    // service worker nuevo a medio activar, un chunk que no llegó a cachearse
    // a tiempo en una conexión móvil lenta, etc. — este código corre ANTES de
    // que se cargue el bundle de React, así que funciona incluso si el propio
    // arranque de la app nunca llega a ejecutarse. Se hace una recuperación
    // dura: se desregistra el service worker y se borran sus caches, para que
    // la siguiente carga no pueda quedarse pegada por la misma causa.
    (function() {
      var UPDATE_FLAG = 'pwa-update-pending';
      var BOOT_TIMEOUT_MS = 10000;

      if (!sessionStorage.getItem(UPDATE_FLAG)) return;

      var recovered = false;

      function hardRecover() {
        if (recovered) return;
        recovered = true;
        sessionStorage.removeItem(UPDATE_FLAG);

        var cleanup = Promise.resolve();

        if ('serviceWorker' in navigator) {
          cleanup = navigator.serviceWorker.getRegistrations()
            .then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            })
            .catch(function() {});
        }

        if (window.caches) {
          cleanup = cleanup.then(function() {
            return caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            });
          }).catch(function() {});
        }

        cleanup.finally(function() {
          window.location.reload();
        });
      }

      var watchdog = setTimeout(hardRecover, BOOT_TIMEOUT_MS);

      window.addEventListener('app-booted', function() {
        clearTimeout(watchdog);
        sessionStorage.removeItem(UPDATE_FLAG);
      });
    })();
  </script>

  <!--
    El color de la barra de estado antes de que haya CSS. Son los dos valores
    de `--status-bar` del tema azul, que es el de serie (ver el bloque
    EL COLOR DE LA BARRA DE ESTADO en `global/index.css`). En cuanto la hoja de
    estilos está puesta, `syncStatusBarColor` afina el tono del esquema
    elegido; estos dos solo tienen que acertar con CLARO U OSCURO.
  -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: dark)" />
  <script>
    /*
      EL COLOR DE LA BARRA DE ESTADO, DECIDIDO ANTES DE PINTAR NADA.

      EL FALLO QUE ESTO ARREGLA — en Android, en algunos dispositivos, la barra
      de estado se quedaba en blanco CON LOS ICONOS EN BLANCO: la hora y la
      batería desaparecían.

      El fondo de esa barra lo pone `theme-color`, y el color de sus iconos lo
      elige el sistema a partir de ese fondo: claro pide iconos oscuros, oscuro
      los pide blancos. Pero esa decisión se toma UNA vez, con el valor que hay
      al abrir, y hay móviles que no la rehacen si el color cambia después.

      Y aquí cambiaba siempre que el tema de la APP no coincidía con el del
      SISTEMA, que es algo que esta app permite: las dos etiquetas de arriba se
      eligen por `prefers-color-scheme` —o sea, por el sistema—, así que con el
      móvil en oscuro y la app en claro se abría con fondo oscuro (iconos
      blancos) y un instante después `syncStatusBarColor` lo pasaba a claro. En
      los móviles que no rehacen la cuenta: blanco sobre blanco.

      Así que aquí se deja ya puesto el valor del tema de la app. Manda lo
      guardado en `localStorage` —la misma clave que lee `main.tsx`—, y los
      colores salen de las propias etiquetas de arriba, para no tener una
      segunda copia de la paleta que se quede vieja. El tono exacto del esquema
      de color (azul, verde…) lo afina `syncStatusBarColor` un instante después;
      lo que no puede esperar es CLARO U OSCURO, que es lo que decide si los
      iconos se ven.

      De paso se aplica ya `data-theme`, y así un tema oscuro deja de abrir con
      un destello claro.

      LO DE «SEGUIR EL TEMA DEL SISTEMA» — ese interruptor vive en los ajustes
      sincronizados, o sea en la base de datos local, que aquí todavía no está
      abierta. Por eso `useThemeSwitcher` deja una copia suya en
      `localStorage['theme_follow_os']`: no es el ajuste, es un espejo, y solo
      lo usa este script. Con él puesto se pregunta al sistema en vez de mirar
      el último tema guardado, que si el móvil cambió de claro a oscuro con la
      app cerrada ya no vale.
    */
    (function () {
      try {
        var leer = function (clave) {
          try {
            return window.localStorage.getItem(clave);
          } catch (e) {
            return null;
          }
        };

        var valorDe = function (guardado, pordefecto) {
          if (!guardado) return pordefecto;
          try {
            return JSON.parse(guardado);
          } catch (e) {
            return guardado;
          }
        };

        var sigueAlSistema = leer('theme_follow_os') === '1';

        var tema = sigueAlSistema
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          : valorDe(leer('theme'), 'light');

        var color = valorDe(leer('color'), 'blue');

        document.documentElement.setAttribute('data-theme', color + '-' + tema);

        var claro = document.querySelector(
          "meta[name='theme-color'][media*='light']"
        );
        var oscuro = document.querySelector(
          "meta[name='theme-color'][media*='dark']"
        );

        if (!claro || !oscuro) return;

        var elegido = (tema === 'dark' ? oscuro : claro).getAttribute('content');

        var metas = document.querySelectorAll("meta[name='theme-color']");

        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', elegido);
        }
      } catch (e) {
        /* Sin almacenamiento se queda como estaba: el tema del sistema. */
      }
    })();
  </script>

  <!--
    "black-translucent" SE QUEDA. NO LO CAMBIES A "default".

    Lo cambié a "default" el 2026-09-20 para matar la banda borrosa de iOS 26/27
    y fue un error que costó una reinstalación: en iOS los tres valores de esta
    etiqueta son fijos y NINGUNO sigue al tema de la app. Con "default" la barra
    se queda CLARA siempre, así que en tema oscuro quedaba una franja blanca
    arriba que no había forma de teñir — `theme-color` no la toca.

    Con "black-translucent" la página se pinta por debajo del reloj, y entonces
    el color de la barra es sencillamente el de la página: sigue al tema solo y
    no hay costura. Eso es lo que esta app quiere.

    LA BANDA BORROSA se ataca por otro sitio: desde iOS 26 el sistema rellena el
    hueco del reloj con el cristal de Liquid Glass cuando no encuentra un color
    sólido en el borde de arriba, y aquí no lo encontraba porque la barra de
    título es transparente mientras no se desplaza. Ahora sí lo hay: ver
    LA BARRA DE ESTADO, SÓLIDA en `global/index.css`.

    `viewport-fit=cover` es imprescindible con esto: es lo que hace que
    `env(safe-area-inset-top)` valga lo que mide la barra de estado.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
